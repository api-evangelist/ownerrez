aid: ownerrez
name: OwnerRez
review:
  question: Does OwnerRez expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. OwnerRez's public API v2 is
    request/response REST/JSON over HTTPS. Its only server-push mechanism is
    outbound webhooks - OwnerRez POSTs event notifications to a subscriber URL
    configured via the WebhookSubscriptions resource. There is no
    bidirectional or streaming WebSocket (ws:// or wss://) transport on
    OwnerRez's own API to model, so an AsyncAPI document describing a WebSocket
    channel would not correspond to any real surface.
findings:
  summary: |
    OwnerRez does not publish a documented public WebSocket API. OwnerRez is
    vacation-rental / short-term-rental property management software. Its
    public developer surface is the OwnerRez API v2, a REST/JSON API served
    under https://api.ownerrez.com/v2 and documented at
    https://api.ownerrez.com/help/v2 (with a machine-readable operation index
    at https://api.ownerrez.com/help/v2/index.md). Requests are authenticated
    either with an OAuth 2.0 access token (Authorization Code Grant, RFC 6749
    Section 4.1) or with an API key / Personal Access Token supplied as the
    username in HTTP Basic auth. Server-to-app eventing is handled by outbound
    webhooks (POSTs to a subscriber URL) managed through the
    WebhookSubscriptions resource, not by a WebSocket. No realtime,
    bidirectional, or streaming WebSocket endpoint is documented anywhere in
    OwnerRez's API reference as of the review date.
  openSource: |
    The OwnerRez platform itself is closed-source, commercial SaaS. OwnerRez
    does maintain a public GitHub organization (github.com/ownerrez) with
    official open-source client tooling around the API - a Zapier integration
    (orez-zapier), a WordPress plugin (orez-wp), and a PHP API wrapper
    (orez-api-php) - but the core product and API service are not open source.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.ownerrez.com/v2
      documented: true
      note: The OwnerRez API v2. Request/response JSON over HTTPS. OAuth 2.0 bearer or HTTP Basic (API key/PAT as username).
    - protocol: OAuth2
      scheme: https
      documented: true
      note: Authorization Code Grant. Authorize at https://app.ownerrez.com/oauth/authorize, exchange code at https://api.ownerrez.com/oauth/access_token (alias /oauth/token).
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound webhooks POST event notifications to a subscriber URL. Configured via the WebhookSubscriptions resource. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the OwnerRez API v2 reference as of the review date.
