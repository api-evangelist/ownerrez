sources:
  - url: https://api.ownerrez.com/help/v2
    type: APIReference
    note: OwnerRez API v2 interactive reference. Base URL, resources, OAuth2 + HTTP Basic auth. No WebSocket.
  - url: https://api.ownerrez.com/help/v2/index.md
    type: APIReference
    note: Machine-readable operation index; source of the confirmed endpoint paths and methods.
  - url: https://www.ownerrez.com/support/articles/api-overview
    type: Documentation
    note: API for Apps overview. REST/JSON, OAuth apps, webhooks.
  - url: https://www.ownerrez.com/support/articles/api-auth
    type: Documentation
    note: Authentication - OAuth 2.0 Authorization Code Grant and API key via HTTP Basic.
  - url: https://www.ownerrez.com/support/articles/api-webhooks
    type: Documentation
    note: Outbound webhooks (reverse API). Server-to-endpoint HTTP POST, not WebSocket.
  - url: https://www.ownerrez.com/support/articles/api-rate-limiting
    type: Documentation
    note: 300 requests per 5 minutes per IP; 429 on exceed; auto-unblock.
  - url: https://github.com/ownerrez
    type: SourceCode
    note: Public org with open-source client tooling (Zapier, WordPress, PHP wrapper); core product is closed-source.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. OwnerRez's public API is
    request/response REST (API v2) with outbound webhooks for server-to-app
    eventing. No AsyncAPI document was created because there is no server-push
    WebSocket transport on OwnerRez's own API to model; webhooks are ordinary
    HTTP POSTs to a subscriber URL and are represented by the
    WebhookSubscriptions REST resource.
