created: '2026-07-03'
modified: '2026-07-03'
reconciled: false
tags:
- Vacation Rental
- Short-Term Rental
- Property Management
- Hospitality
- Plans
description: >-
  OwnerRez is sold as a per-property SaaS subscription rather than a
  metered/per-call API product. Pricing is billed per account on a sliding
  scale: a $40/month minimum covers your first property (active or disabled),
  and the effective per-property price decreases as you add more properties. A
  14-day free trial (including premium features) is available with no contract.
  Premium modules - such as the Property Management add-on, QuickBooks
  integration, and hosted Websites - are billed separately on top of the base
  subscription. The API v2 is included with an OwnerRez subscription; there is
  no separate per-request API fee.
notes: >-
  Exact tier breakpoints on the sliding scale and premium-module rates are not
  reconciled here; use the OwnerRez pricing calculator to compute a monthly
  bill. Verify current numbers on the pricing page during reconciliation.
sources:
- https://www.ownerrez.com/pricing
- https://www.ownerrez.com/support/articles/costs-and-fees
- https://api.ownerrez.com/help/v2
plans:
