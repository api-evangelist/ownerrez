aid: ownerrez
url: https://raw.githubusercontent.com/api-evangelist/ownerrez/refs/heads/main/apis.yml
name: OwnerRez
kind: company
description: OwnerRez is vacation-rental and short-term-rental property management
  software for hosts, owners, and property managers, covering channel management,
  bookings, guest CRM, quoting, payments, messaging, reviews, and a hosted booking
  website. The OwnerRez API v2 is a REST/JSON API served under
  https://api.ownerrez.com/v2 that exposes bookings, properties, listings, guests,
  inquiries, quotes, reviews, guest messaging, payments and financials, custom
  fields and tags, owners, and outbound webhook subscriptions. Requests are
  authenticated with an OAuth 2.0 access token (Authorization Code Grant) or with
  an API key / Personal Access Token via HTTP Basic auth, and server-to-app events
  are delivered through outbound webhooks.
