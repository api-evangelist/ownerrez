meters:
- name: properties
  description: Number of properties under management, the primary per-property subscription cost driver (sliding scale above the $40/month minimum).
  unit: properties
  aggregation: max
  dimensions:
  - account
- name: premium_modules
  description: Premium add-on modules enabled - Property Management, QuickBooks integration, and hosted Websites - each billed separately.
  unit: modules
  aggregation: sum
  dimensions:
  - account
  - module
- name: api_requests
  description: API v2 requests. Included in the subscription (not separately billed); tracked only against the 300-per-5-minute rate limit.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - ip
principles:
- name: Visibility
  description: Track active vs disabled property counts and enabled premium modules against the single monthly account invoice.
- name: Allocation
  description: Map property counts and premium modules to owners or portfolios so subscription cost maps to internal cost centers.
- name: Optimization
  description: Remove properties no longer managed (disabled properties still count toward the minimum), and disable premium modules that are not used.
- name: Accountability
  description: Assign an owner for the OwnerRez account; review the monthly invoice against property count and module changes.
