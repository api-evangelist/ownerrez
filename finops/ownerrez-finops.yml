description: >-
  FinOps view of OwnerRez spend. OwnerRez is a per-property SaaS subscription:
  the dominant cost driver is the number of properties under management, billed
  monthly per account on a sliding scale above a $40/month minimum. The API v2
  is included in the subscription with no separate per-request charge, so API
  usage itself is not a metered cost line - the cost is the underlying seat/
  property count plus any premium modules (Property Management, QuickBooks,
  hosted Websites) enabled on the account.
notes: >-
  Per-property tier rates and premium-module fees are not reconciled here;
  verify on the OwnerRez pricing page and calculator. Cost optimization is
  primarily about right-sizing the property count (disabling unused properties
  still counts toward the minimum) and only enabling premium modules that are
  used.
